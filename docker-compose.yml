worldserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legioncore-worldserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["/opt/legioncore/bin/worldserver"]
    volumes:
      - legion_logs:/opt/legioncore/logs
      - legion_etc:/opt/legioncore/etc

  bnetserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legioncore-bnetserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["/opt/legioncore/bin/bnetserver"]
    volumes:
      - legion_logs:/opt/legioncore/logs
      - legion_etc:/opt/legioncore/etc

volumes:
  mysql_data:
  legion_logs:
  legion_etc:
