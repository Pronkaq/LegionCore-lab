services:
  db:
    image: mysql:5.7
    container_name: legioncore-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  worldserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legioncore-worldserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /usr/local/bin
    command: ["/usr/local/bin/worldserver"]
    environment:
      CLIENTDATA_URL: ${CLIENTDATA_URL}
    volumes:
      - legion_logs:/opt/legioncore/logs
      - ./docker/runtime/config/worldserver.conf:/usr/local/etc/worldserver.conf

  bnetserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legioncore-bnetserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /usr/local/bin
    command: ["/usr/local/bin/bnetserver"]
    volumes:
      - legion_logs:/opt/legioncore/logs
      - ./docker/runtime/config/bnetserver.conf:/usr/local/etc/bnetserver.conf

volumes:
  mysql_data:
  legion_logs:
